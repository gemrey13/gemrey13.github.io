<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />

    <!-- SEO base meta tags -->
    <meta name="author" content="Gem Rey Rañola" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://codewithgem.is-a.dev/" />

    <!-- Default title (overridden by react-helmet-async per page) -->
    <title>Gem Rey Rañola — Software Developer</title>
    <meta
      name="description"
      content="Software Developer building responsive, scalable applications. Specializing in React, TypeScript, Electron, and full-stack development. More than just a developer."
    />
    <meta name="keywords" content="Software Developer, React, TypeScript, Electron, Full-Stack, Gem Rey Rañola, Portfolio, Web Developer" />

    <!-- Open Graph fallback (overridden per page by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gem Rey Rañola — Portfolio" />
    <meta property="og:title" content="Gem Rey Rañola — Software Developer" />
    <meta property="og:description" content="Software Developer building responsive, scalable applications. Specializing in React, TypeScript, Electron, and full-stack development." />
    <meta property="og:url" content="https://codewithgem.is-a.dev/" />
    <meta property="og:locale" content="en_US" />
    <!-- TODO: Replace with actual OG image once designed -->
    <!-- <meta property="og:image" content="https://codewithgem.is-a.dev/og-image.png" /> -->
    <!-- <meta property="og:image:width" content="1200" /> -->
    <!-- <meta property="og:image:height" content="630" /> -->

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gem Rey Rañola — Software Developer" />
    <meta name="twitter:description" content="Software Developer building responsive, scalable applications. More than just a developer." />
    <!-- TODO: Replace with actual Twitter image once designed -->
    <!-- <meta name="twitter:image" content="https://codewithgem.is-a.dev/og-image.png" /> -->

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Font loading — display swap for performance -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
